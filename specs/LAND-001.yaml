spec_id: LAND-001
version: "1.0.0"
status: frozen
module: LandModule
capability: land

purpose: >-
  Land a simulated UAV from an airborne state to the local ground reference,
  keeping horizontal drift within an allowed tolerance and completing within
  the requested timeout.

coordinate_convention:
  frame: LOCAL_NED
  measured_position: [north_m, east_m, down_m]
  altitude_m: >-
    Positive-up operator-facing altitude derived from measured NED down using
    altitude_m = -z. Ground acceptance is symmetric around zero to tolerate
    small simulator/reference offsets after touchdown.

input:
  user_provided:
    task_id:
      type: string
      required: true
    scenario_id:
      type: string
      required: false
    frame:
      type: string
      required: true
      allowed_values:
        - LOCAL_NED
    ground_altitude_tolerance_m:
      type: number
      finite: true
      exclusive_minimum: 0
      required: true
    horizontal_tolerance_m:
      type: number
      finite: true
      exclusive_minimum: 0
      required: true
    timeout_s:
      type: number
      finite: true
      exclusive_minimum: 0
      required: true

  system_observed:
    current_position:
      source: telemetry
      user_settable: false
    vehicle_state:
      source: telemetry
      user_settable: false
    airborne_state:
      source: telemetry
      user_settable: false
    localization_valid:
      source: telemetry
      user_settable: false
    connection_state:
      source: telemetry
      user_settable: false

preconditions:
  connected: true
  airborne: true
  localization_valid: true

output:
  fields:
    task_id: string
    status: string
    start_position: array[3]
    final_position: array[3]
    start_altitude_m: number
    final_altitude_m: number
    descent_m: number
    horizontal_drift_m: number
    final_airborne: boolean
    elapsed_time_s: number

failure_codes:
  - INVALID_INPUT
  - PRECONDITION_FAILED
  - UNSUPPORTED_FRAME
  - LOCALIZATION_LOST
  - TIMEOUT
  - EXECUTION_ERROR
  - VERIFICATION_FAILED

acceptance:
  authoritative_verifier: independent_python_verifier
  checks:
    ground_altitude:
      rule: abs(-final_z) <= input.ground_altitude_tolerance_m
    horizontal_drift:
      rule: euclidean_xy(final_xy, initial_xy) <= input.horizontal_tolerance_m
    landed:
      rule: final_vehicle_state != AIRBORNE
    landing_transition:
      rule: telemetry_contains_airborne_sample_before_final_non_airborne_sample
    timeout:
      rule: elapsed_time_s <= input.timeout_s
    telemetry:
      rule: telemetry_exists && timestamps_valid && localization_valid
  overall_rule: all_checks_pass
  forbidden_acceptance_source:
    - module_output.status
    - ai_agent_self_assessment

evidence_contract:
  required:
    - raw_user_input.json
    - input.json
    - changed_files.json
    - telemetry.csv
    - events.jsonl
    - module_output.json
    - lifecycle.json
    - verification.json
    - metadata.json
  telemetry_minimum_fields:
    - timestamp
    - x
    - y
    - z
    - vx
    - vy
    - vz
    - vehicle_state
    - localization_valid

immutability:
  after_experiment_start: true
  ai_may_modify: false
  recovery_agent_may_modify: false
