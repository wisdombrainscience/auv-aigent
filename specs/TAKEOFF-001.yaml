spec_id: TAKEOFF-001
version: "1.0.0"
status: frozen
module: TakeoffModule
capability: takeoff_to_altitude

purpose: >-
  Take off a simulated UAV from a non-airborne state to a user-provided
  positive-up local altitude while keeping horizontal drift within an allowed
  tolerance and completing within the requested timeout.

coordinate_convention:
  frame: LOCAL_NED
  measured_position: [north_m, east_m, down_m]
  target_altitude_m: >-
    Positive-up operator-facing altitude. Verification converts measured NED
    down to altitude using altitude_m = -z.

input:
  user_provided:
    task_id:
      type: string
      required: true
    scenario_id:
      type: string
      required: false
    frame:
      type: string
      required: true
      allowed_values:
        - LOCAL_NED
    target_altitude_m:
      type: number
      finite: true
      exclusive_minimum: 0
      required: true
    altitude_tolerance_m:
      type: number
      finite: true
      exclusive_minimum: 0
      required: true
    horizontal_tolerance_m:
      type: number
      finite: true
      exclusive_minimum: 0
      required: true
    timeout_s:
      type: number
      finite: true
      exclusive_minimum: 0
      required: true

  system_observed:
    current_position:
      source: telemetry
      user_settable: false
    vehicle_state:
      source: telemetry
      user_settable: false
    airborne_state:
      source: telemetry
      user_settable: false
    localization_valid:
      source: telemetry
      user_settable: false
    connection_state:
      source: telemetry
      user_settable: false

preconditions:
  connected: true
  airborne: false
  localization_valid: true

output:
  fields:
    task_id: string
    status: string
    target_altitude_m: number
    measured_altitude_m: number
    altitude_error_m: number
    horizontal_drift_m: number
    start_position: array[3]
    final_position: array[3]
    elapsed_time_s: number

failure_codes:
  - INVALID_INPUT
  - PRECONDITION_FAILED
  - UNSUPPORTED_FRAME
  - LOCALIZATION_LOST
  - TIMEOUT
  - EXECUTION_ERROR
  - VERIFICATION_FAILED

acceptance:
  authoritative_verifier: independent_python_verifier
  checks:
    altitude:
      rule: abs((-final_z) - input.target_altitude_m) <= input.altitude_tolerance_m
    horizontal_drift:
      rule: euclidean_xy(final_xy, initial_xy) <= input.horizontal_tolerance_m
    airborne:
      rule: final_vehicle_state == AIRBORNE
    takeoff_transition:
      rule: telemetry_contains_non_airborne_sample_before_final_airborne_sample
    timeout:
      rule: elapsed_time_s <= input.timeout_s
    telemetry:
      rule: telemetry_exists && timestamps_valid && localization_valid
  overall_rule: all_checks_pass
  forbidden_acceptance_source:
    - module_output.status
    - ai_agent_self_assessment

evidence_contract:
  required:
    - raw_user_input.json
    - input.json
    - changed_files.json
    - telemetry.csv
    - events.jsonl
    - module_output.json
    - lifecycle.json
    - verification.json
    - metadata.json
  telemetry_minimum_fields:
    - timestamp
    - x
    - y
    - z
    - vx
    - vy
    - vz
    - vehicle_state
    - localization_valid

immutability:
  after_experiment_start: true
  ai_may_modify: false
  recovery_agent_may_modify: false
